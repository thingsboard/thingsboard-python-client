[tool.poetry]
name = "thingsboard-python-client"
version = "4.3.1.4"
description = "Monorepo root — version source for all ThingsBoard Python client editions"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-mock = "^3.14"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "ce/tb_ce_client",
    "pe/tb_pe_client",
    "paas/tb_paas_client",
    "*/target",
    "dist",
    ".venv",
    ".idea",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests insert paths into sys.path before importing local packages, and contain
# long explanatory comments inline with assertions; both are intentional.
"tests/**" = ["E402", "E501"]
# These two test modules mirror documentation code snippets verbatim. The
# snippets re-import inside each test (so they read as standalone examples in
# the docs) and sometimes assign return values that the snippet would print —
# all of which is intentional and should not be reorganized by the linter.
"tests/test_python_client_docs_ce.py" = ["E402", "E501", "F401", "F811", "F841", "I001"]
"tests/test_python_client_docs_pe.py" = ["E402", "E501", "F401", "F811", "F841", "I001"]
